server:
  port: ${EUREKA_PORT:8761}

spring:
  application:
    name: bytemarket-eureka-server
  profiles:
    active: ${SPRING_PROFILE:local}

eureka:
  client:
    # Es el propio registro: no se registra en sí mismo ni se descarga a sí mismo.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:${EUREKA_PORT:8761}/eureka/

# ── Sonda de salud ───────────────────────────────────────────
# Solo se expone "health": los demás endpoints del actuator (env, beans,
# mappings) revelan configuración interna y no hacen falta aquí.
# Lo consulta el healthcheck de Docker, que así espera a que el servicio
# esté REALMENTE listo —base de datos incluida— y no solo a que el puerto
# responda.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
